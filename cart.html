<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>장바구니 | 핏룸 Fit Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/sub.css">
</head>
<body data-title="장바구니" data-desc="">

  <!-- 헤더 · 네비게이션 (common.js가 채움) -->
  <div id="header"></div>

  <main>
    <!-- 페이지 제목 · 위치 · 2차 메뉴 탭 (common.js가 채움) -->
    <div id="pageHead"></div>

    <section class="inner sub-wrap">
      <div class="cart-layout" id="cartWrap">
        <div class="cart-main">
          <div class="cart-bar">
            <label class="check"><input type="checkbox" id="ctAll" checked><span>전체 선택 (<b id="ctSel">0</b>/<span id="ctTotal">0</span>)</span></label>
            <button type="button" class="link-btn" id="ctDelSel">선택 삭제</button>
          </div>
          <ul class="cart-list" id="ctList"></ul>
        </div>
        <aside class="summary" id="ctSummary"></aside>
      </div>
      <div class="empty" id="ctEmpty" hidden>
        <p class="empty-title">장바구니가 비어 있어요</p>
        <p>내 방에 맞는 가구를 먼저 찾아볼까요?</p>
        <div class="form-btns center">
          <a href="fitcheck.html" class="btn btn-oak">핏 체크</a>
          <a href="shop.html" class="btn btn-line">전체 상품</a>
        </div>
      </div>
    </section>
  </main>

  <!-- 푸터 (common.js가 채움) -->
  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
