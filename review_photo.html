<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>포토 리뷰 | 핏룸 Fit Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/sub.css">
</head>
<body data-title="포토 리뷰" data-desc="사진이 있는 후기만 모아 봤어요." data-mode="photo">

  <!-- 헤더 · 네비게이션 (common.js가 채움) -->
  <div id="header"></div>

  <main>
    <!-- 페이지 제목 · 위치 · 2차 메뉴 탭 (common.js가 채움) -->
    <div id="pageHead"></div>

    <section class="inner sub-wrap">
      <div class="toolbar">
        <p>사진 리뷰 <b id="phCount">0</b>개</p>
        <a href="review_write.html" class="btn btn-oak btn-sm">리뷰 쓰기</a>
      </div>
      <div class="photo-grid" id="phGrid"></div>
    </section>

    <!-- 사진을 누르면 열리는 창 -->
    <div class="modal" id="phModal" hidden>
      <div class="modal-box">
        <button type="button" class="modal-x" id="phClose" aria-label="닫기">×</button>
        <div id="phBody"></div>
      </div>
    </div>
  </main>

  <!-- 푸터 (common.js가 채움) -->
  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
