<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전체 리뷰 | 핏룸 Fit Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/sub.css">
</head>
<body data-title="전체 리뷰" data-desc="방 크기까지 적힌 구매 후기">

  <!-- 헤더 · 네비게이션 (common.js가 채움) -->
  <div id="header"></div>

  <main>
    <!-- 페이지 제목 · 위치 · 2차 메뉴 탭 (common.js가 채움) -->
    <div id="pageHead"></div>

    <section class="inner sub-wrap">

      <!-- 별점 요약 -->
      <div class="rv-summary" id="rvSummary"></div>

      <!-- 공간 유형 필터 + 정렬 -->
      <div class="toolbar">
        <div class="chips" id="rvChips">
          <button type="button" class="chip on" data-type="all">전체</button>
          <button type="button" class="chip" data-type="oneroom">원룸</button>
          <button type="button" class="chip" data-type="officetel">오피스텔</button>
          <button type="button" class="chip" data-type="tworoom">투룸</button>
        </div>
        <div class="toolbar-r">
          <select id="rvSort" class="select select-sm">
            <option value="new">최신순</option>
            <option value="high">별점 높은 순</option>
            <option value="low">별점 낮은 순</option>
          </select>
          <a href="review_write.html" class="btn btn-oak btn-sm">리뷰 쓰기</a>
        </div>
      </div>

      <div class="rv-list" id="rvList"></div>
    </section>
  </main>

  <!-- 푸터 (common.js가 채움) -->
  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
