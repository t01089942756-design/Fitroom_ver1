<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공지사항 | 핏룸 Fit Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/sub.css">
</head>
<body data-title="공지사항" data-desc="핏룸 소식과 안내" data-mode="notice">

  <!-- 헤더 · 네비게이션 (common.js가 채움) -->
  <div id="header"></div>

  <main>
    <!-- 페이지 제목 · 위치 · 2차 메뉴 탭 (common.js가 채움) -->
    <div id="pageHead"></div>

    <section class="inner sub-wrap">
      <table class="board" id="ntBoard">
        <thead>
          <tr><th class="c-no">번호</th><th class="c-tag">분류</th><th>제목</th><th class="c-date">등록일</th></tr>
        </thead>
        <tbody id="ntList"></tbody>
      </table>
    </section>
  </main>

  <!-- 푸터 (common.js가 채움) -->
  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/support.js"></script>
</body>
</html>
